name: Test custom committer inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a file to commit
        run: |
          echo "custom committer test $(date +%s)" > hardened/tests/custom-committer-test.txt

      - id: action
        uses: .
        with:
          add: 'hardened/tests/custom-committer-test.txt'
          message: 'test: custom committer commit'
          committer_name: 'Custom Committer'
          committer_email: 'custom-committer@example.com'
          commit: '--no-verify'
          push: 'false'

      - name: Assert committed output
        env:
          COMMITTED: ${{ steps.action.outputs.committed }}
        run: |
          echo "committed: $COMMITTED"
          if [ "$COMMITTED" != "true" ]; then
            echo "FAIL: expected committed=true, got '$COMMITTED'"
            exit 1
          fi
          echo "PASS: committed=true"

      - name: Assert committer info in git log
        run: |
          COMMITTER_NAME=$(git log -1 --pretty=format:'%cn')
          COMMITTER_EMAIL=$(git log -1 --pretty=format:'%ce')
          echo "committer name: $COMMITTER_NAME"
          echo "committer email: $COMMITTER_EMAIL"
          if [ "$COMMITTER_NAME" != "Custom Committer" ]; then
            echo "FAIL: expected committer name 'Custom Committer', got '$COMMITTER_NAME'"
            exit 1
          fi
          if [ "$COMMITTER_EMAIL" != "custom-committer@example.com" ]; then
            echo "FAIL: expected committer email 'custom-committer@example.com', got '$COMMITTER_EMAIL'"
            exit 1
          fi
          echo "PASS: committer info correct"
