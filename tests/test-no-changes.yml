name: Test no changes to commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        with:
          # Add a non-existent file pattern that produces no changes
          add: 'tests/nonexistent-file-that-does-not-exist.txt'
          message: 'chore: should not commit'
          push: 'false'
          fetch: 'false'
          pathspec_error_handling: 'ignore'
          author_name: 'Test User'
          author_email: 'test@example.com'

      - name: Assert committed is false (no changes)
        env:
          COMMITTED: ${{ steps.action.outputs.committed }}
          PUSHED: ${{ steps.action.outputs.pushed }}
        run: |
          echo "committed: $COMMITTED"
          echo "pushed: $PUSHED"
          if [ "$COMMITTED" != "false" ]; then
            echo "FAIL: expected committed=false when no changes, got '$COMMITTED'"
            exit 1
          fi
          echo "PASS: committed=false as expected when no changes"
          if [ "$PUSHED" != "false" ]; then
            echo "FAIL: expected pushed=false when no changes, got '$PUSHED'"
            exit 1
          fi
          echo "PASS: pushed=false as expected when no changes"
