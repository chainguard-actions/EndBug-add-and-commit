name: Test remove input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create and commit a file to be removed
        run: |
          echo "file to remove" > hardened/tests/file-to-remove.txt
          git add hardened/tests/file-to-remove.txt
          git commit -m "add file to be removed"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness

      - name: Delete the file from disk so git rm can stage the removal
        run: |
          rm hardened/tests/file-to-remove.txt

      - id: action
        uses: .
        with:
          add: '.'
          remove: 'hardened/tests/file-to-remove.txt'
          message: 'test: remove a file'
          push: 'false'

      - name: Assert committed output
        env:
          COMMITTED: ${{ steps.action.outputs.committed }}
        run: |
          echo "committed: $COMMITTED"
          if [ "$COMMITTED" != "true" ]; then
            echo "FAIL: expected committed=true, got '$COMMITTED'"
            exit 1
          fi
          echo "PASS: committed=true"

      - name: Assert file is no longer tracked
        run: |
          if git ls-files --error-unmatch hardened/tests/file-to-remove.txt 2>/dev/null; then
            echo "FAIL: file still tracked in git"
            exit 1
          fi
          echo "PASS: file removed from git"
