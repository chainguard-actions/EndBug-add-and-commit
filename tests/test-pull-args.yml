name: Test pull input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a file to commit
        run: |
          echo "test-pull-args-$(date +%s)" > hardened/tests/pull-args-test.txt

      - id: action
        uses: .
        with:
          add: 'hardened/tests/pull-args-test.txt'
          message: 'test: commit with pull args'
          pull: '--rebase'
          push: 'false'

      - name: Assert committed output
        env:
          COMMITTED: ${{ steps.action.outputs.committed }}
        run: |
          echo "committed: $COMMITTED"
          if [ "$COMMITTED" != "true" ]; then
            echo "FAIL: expected committed=true but got '$COMMITTED'"
            exit 1
          fi
          echo "PASS"

      - name: Cleanup
        if: always()
        run: |
          git reset HEAD~1 --soft 2>/dev/null || true
          rm -f hardened/tests/pull-args-test.txt
