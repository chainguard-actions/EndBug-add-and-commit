name: Test basic commit (no push)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a file to commit
        run: |
          echo "basic commit test $(date +%s)" > tests/basic-commit-test-file.txt

      - id: action
        uses: .
        with:
          add: 'tests/basic-commit-test-file.txt'
          message: 'chore: basic commit test'
          push: 'false'
          fetch: 'false'
          author_name: 'Test User'
          author_email: 'test@example.com'

      - name: Assert committed output is true
        env:
          COMMITTED: ${{ steps.action.outputs.committed }}
          PUSHED: ${{ steps.action.outputs.pushed }}
          COMMIT_SHA: ${{ steps.action.outputs.commit_sha }}
          COMMIT_LONG_SHA: ${{ steps.action.outputs.commit_long_sha }}
        run: |
          echo "committed: $COMMITTED"
          echo "pushed: $PUSHED"
          echo "commit_sha: $COMMIT_SHA"
          echo "commit_long_sha: $COMMIT_LONG_SHA"
          if [ "$COMMITTED" != "true" ]; then
            echo "FAIL: expected committed=true, got '$COMMITTED'"
            exit 1
          fi
          echo "PASS: committed=true"
          if [ "$PUSHED" != "false" ]; then
            echo "FAIL: expected pushed=false (push disabled), got '$PUSHED'"
            exit 1
          fi
          echo "PASS: pushed=false"
          if [ -z "$COMMIT_SHA" ]; then
            echo "FAIL: commit_sha is empty"
            exit 1
          fi
          echo "PASS: commit_sha='$COMMIT_SHA'"
          if [ -z "$COMMIT_LONG_SHA" ]; then
            echo "FAIL: commit_long_sha is empty"
            exit 1
          fi
          echo "PASS: commit_long_sha='$COMMIT_LONG_SHA'"
          # Verify the commit actually exists in git
          git log --oneline -1
