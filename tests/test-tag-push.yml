name: Test tag_push input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a file to commit
        run: |
          echo "tag push test $(date +%s)" > hardened/tests/tag-push-test.txt

      - id: action
        uses: .
        with:
          add: 'hardened/tests/tag-push-test.txt'
          message: 'test: commit with tag and tag_push'
          tag: 'v0.0.99-test --force'
          tag_push: '--force'
          push: 'true'

      - name: Assert committed output
        env:
          COMMITTED: ${{ steps.action.outputs.committed }}
        run: |
          echo "committed: $COMMITTED"
          if [ "$COMMITTED" != "true" ]; then
            echo "FAIL: expected committed=true, got '$COMMITTED'"
            exit 1
          fi
          echo "PASS: committed=true"

      - name: Assert tagged output
        env:
          TAGGED: ${{ steps.action.outputs.tagged }}
        run: |
          echo "tagged: $TAGGED"
          if [ "$TAGGED" != "true" ]; then
            echo "FAIL: expected tagged=true, got '$TAGGED'"
            exit 1
          fi
          echo "PASS: tagged=true"

      - name: Assert tag_pushed output
        env:
          TAG_PUSHED: ${{ steps.action.outputs.tag_pushed }}
        run: |
          echo "tag_pushed: $TAG_PUSHED"
          if [ "$TAG_PUSHED" != "true" ]; then
            echo "FAIL: expected tag_pushed=true, got '$TAG_PUSHED'"
            exit 1
          fi
          echo "PASS: tag_pushed=true"
