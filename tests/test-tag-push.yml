name: Test tag_push input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a file to commit
        run: |
          echo "test-tag-push-$(date +%s)" > hardened/tests/tag-push-test.txt

      - id: action
        uses: .
        with:
          add: 'hardened/tests/tag-push-test.txt'
          message: 'test: commit with tag and tag_push'
          tag: 'test-tag-push-v0.0.1 -m "test tag push"'
          tag_push: '--force'
          push: 'true'

      - name: Assert committed output
        env:
          COMMITTED: ${{ steps.action.outputs.committed }}
          TAGGED: ${{ steps.action.outputs.tagged }}
        run: |
          echo "committed: $COMMITTED"
          echo "tagged: $TAGGED"
          if [ "$COMMITTED" != "true" ]; then
            echo "FAIL: expected committed=true but got '$COMMITTED'"
            exit 1
          fi
          if [ "$TAGGED" != "true" ]; then
            echo "FAIL: expected tagged=true but got '$TAGGED'"
            exit 1
          fi
          echo "PASS"

      - name: Cleanup
        if: always()
        run: |
          git tag -d test-tag-push-v0.0.1 2>/dev/null || true
          git reset HEAD~1 --soft 2>/dev/null || true
          rm -f hardened/tests/tag-push-test.txt
