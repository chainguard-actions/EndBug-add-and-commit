name: Test new_branch input (create a new branch on commit)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Set up reachable origin for git operations
        run: |
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a file to commit
        run: |
          echo "test content for new branch" > hardened/tests/new-branch-test-file.txt

      - id: action
        uses: .
        with:
          add: 'hardened/tests/new-branch-test-file.txt'
          message: 'test: commit on new branch'
          new_branch: 'test-new-branch-ci'
          push: 'false'
          fetch: 'false'

      - name: Assert committed output
        env:
          COMMITTED: ${{ steps.action.outputs.committed }}
        run: |
          echo "committed: $COMMITTED"
          if [ "$COMMITTED" != "true" ]; then
            echo "FAIL: expected committed=true but got '$COMMITTED'"
            exit 1
          fi
          echo "PASS"

      - name: Assert new branch was created
        run: |
          if ! git branch --list | grep -q 'test-new-branch-ci'; then
            echo "FAIL: expected branch 'test-new-branch-ci' to exist"
            exit 1
          fi
          echo "PASS: branch 'test-new-branch-ci' exists"

      - name: Cleanup test file and branch
        if: always()
        run: |
          rm -f hardened/tests/new-branch-test-file.txt
          git checkout act-harness 2>/dev/null || true
          git branch -D test-new-branch-ci 2>/dev/null || true
