name: Test custom author commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config and local remote
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
          git branch --set-upstream-to=origin/act-harness act-harness 2>/dev/null || true

      - name: Create a test file to commit
        run: |
          echo "custom author test $(date)" > "$GITHUB_WORKSPACE/custom-author-test.txt"

      - id: action
        uses: .
        with:
          add: 'custom-author-test.txt'
          message: 'test: custom author commit'
          author_name: 'Custom Author'
          author_email: 'custom@example.com'
          committer_name: 'Custom Committer'
          committer_email: 'committer@example.com'
          fetch: 'false'
          push: 'origin HEAD:act-harness'

      - name: Assert committed output is true
        env:
          COMMITTED: ${{ steps.action.outputs.committed }}
        run: |
          echo "committed: $COMMITTED"
          if [ "$COMMITTED" != "true" ]; then
            echo "FAIL: expected committed=true but got '$COMMITTED'"
            exit 1
          fi
          echo "PASS: committed=true"

      - name: Assert commit author is set correctly
        run: |
          AUTHOR=$(git log -1 --pretty="%an <%ae>")
          echo "commit author: $AUTHOR"
          if [ "$AUTHOR" != "Custom Author <custom@example.com>" ]; then
            echo "FAIL: expected author 'Custom Author <custom@example.com>' but got '$AUTHOR'"
            exit 1
          fi
          echo "PASS: author matches"

      - name: Assert commit_long_sha is set and non-empty
        env:
          LONG_SHA: ${{ steps.action.outputs.commit_long_sha }}
        run: |
          echo "commit_long_sha: $LONG_SHA"
          if [ -z "$LONG_SHA" ]; then
            echo "FAIL: expected commit_long_sha to be non-empty"
            exit 1
          fi
          echo "PASS: commit_long_sha=$LONG_SHA"
